<!DOCTYPE html>
<html lang="pl-PL">
<head>
  <meta charset="utf-8">
  <title>Formularz - Giergielewicz</title>
</head>
<body bgcolor="#87CEFA">
<center><h1>Formularz ucznia</h1></center>
<form enctype="text/plain" action="mailto:jahu.giergielewicz@gmail.com" method="post">
<table>
  <tr height="100">
    <td width="300">
      <b>Imię</b> <input name="imie" size="22"><br><br>
      <b>Nazwisko</b> <input name="nazwisko" size="22"><br><br>
      <b>Pseudonim</b> <input name="pseudonim" size="22">
    </td>
    <td width="250" align="center">
      <font size="4" color="red"><b>Jak dojeżdżasz do szkoły?</b></font><br><br>
      <select name="dojazd">
        <option value="autobus">Autobus</option>
        <option value="tramwaj">Tramwaj</option>
        <option value="rower">Rower</option>
        <option value="pieszo">Pieszo</option>
      </select>
    </td>
  </tr>
  <tr height="150">
    <td>
      Ulubiony język:<br>
      <input type="checkbox" name="jezyk" value="cpp"> C++<br>
      <input type="checkbox" name="jezyk" value="py"> Python<br>
      <input type="checkbox" name="jezyk" value="js"> JavaScript
    </td>
    <td>
      Czy umiesz programować?<br>
      <input type="radio" name="prog" value="tak"> Tak<br>
      <input type="radio" name="prog" value="nie"> Nie<br>
      <input type="radio" name="prog" value="nw"> Nie wiem
    </td>
  </tr>
  <tr height="100">
    <td>podaj datę <input type="date" name="data"><br>wybierz kolor <input type="color" name="kolor"></td>
    <td>Opinia:<br><textarea name="opinia" cols="25" rows="3"></textarea></td>
  </tr>
  <tr height="80">
    <td><input type="reset" value="Reset" style="height:40px;width:120px"></td>
    <td><input type="submit" value="Wyślij formularz" style="height:40px;width:150px"></td>
  </tr>
</table>
</form>
</body>
</html>
